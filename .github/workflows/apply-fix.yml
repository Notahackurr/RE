name: apply-fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply package
        run: |
          curl -sL "https://cdn.marblism.com/SP7id0Y4Dnx.tgz" -o /tmp/pkg.tgz
          tar -xzf /tmp/pkg.tgz -C .
      - name: Verify
        run: |
          if grep -rln "cleared for use" --include=*.html .; then echo "banned wording still present"; exit 1; fi
          node tools/check-pages.mjs
      - name: Commit and publish
        run: |
          git config user.name "reel-studio-bot"
          git config user.email "bot@reeleditapp.com"
          git add -A
          if git diff --staged --quiet; then echo "nothing to commit"; else
            git commit -m "Music and stock wording: licensed for use; 1080 x 1920 in articles"
            git push origin HEAD:main
          fi
          git push origin HEAD:gh-pages
