name: Refresh trends
on:
  schedule:
    - cron: '37 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: main }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20 }
      - run: node tools/refresh-trends.mjs
      - name: Commit
        run: |
          git config user.name "trends-bot"
          git config user.email "trends-bot@users.noreply.github.com"
          git add trends.json
          git diff --cached --quiet || git commit -m "Refresh trends"
          git push origin HEAD:main HEAD:gh-pages
