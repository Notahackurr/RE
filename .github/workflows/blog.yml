# Keeps the blog index, sitemap and "Blog" menu link up to date, and publishes, whenever an article lands in blog/
# (Marblism commits its articles there). Nothing to set up: no keys or secrets.
name: Blog
on:
  push:
    branches: [main]
    paths: ['blog/**', 'tools/build-blog.mjs', '!blog/index.html']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: main }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20 }
      - name: Update the blog index, sitemap and menu
        run: node tools/build-blog.mjs
      - name: Commit
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add blog sitemap.xml index.html pricing.html data.html about.html refund.html vs/opus-clip.html contact.html privacy.html terms.html
          git diff --cached --quiet || git commit -m "Blog: update the index"
          git pull --rebase origin main
      - name: Publish (only if every page is whole)
        run: |
          if node tools/check-pages.mjs; then git push origin HEAD:main HEAD:gh-pages; else git push origin HEAD:main; echo "::error::Not published: a page looks cut off. The live site keeps its last good version."; exit 1; fi
