# Anything committed to main (from you, GitHub's web editor, Marblism or Claude) goes live,
# but only after checking that no page is cut off. If one is, the live site keeps its last good version.
name: Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20 }
      - name: Check every page, then publish
        run: |
          if node tools/check-pages.mjs; then git push origin HEAD:gh-pages; else echo "::error::Not published: a page looks cut off. The live site keeps its last good version."; exit 1; fi
